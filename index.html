      /* ────────────── HELPERS ────────────── */
      const fmt = (n) => n?.toLocaleString("en-US") + " LBP";

      function getLebanonTime() {
        return new Date(
          new Date().toLocaleString("en-US", { timeZone: "Asia/Beirut" }),
        );
      }

      function checkOpen() {
        const t = getLebanonTime();
        const mins = t.getHours() * 60 + t.getMinutes();
        return mins >= 660 && mins <= 1410; // 11:00–23:30
      }

      function minutesUntilOpen() {
        const t = getLebanonTime();
        const mins = t.getHours() * 60 + t.getMinutes();
        if (mins < 660) return 660 - mins;
        if (mins > 1410) return 660 + (1440 - mins); // next day
        return 0;
      }

      function formatCountdown(m) {
        const h = Math.floor(m / 60),
          mn = m % 60;
        return h > 0 ? `${h}h ${mn}m` : `${mn}m`;
      }

        if (name) lines.push(`👤 *Name:* ${name}`);
        if (phone) lines.push(`📞 *Phone:* ${phone}`);
        if (orderType === "delivery" && address)
          lines.push(`📍 *Address:* ${address}`);
        lines.push("");
        lines.push("━━━━━━━━━━━━━━━━━");
        lines.push("📋 *ORDER DETAILS:*");
        lines.push("━━━━━━━━━━━━━━━━━");
        cart.forEach((item, i) => {
          const removed = item.ingredients.filter(
            (ing) => !item.selected.includes(ing),
          );
          const sizeLabel = item.size ? ` (${item.size})` : "";
          lines.push(`${i + 1}. *${item.name}*${sizeLabel} ×${item.qty}`);
          if (removed.length)
            lines.push(`   ❌ Removed: ${removed.join(", ")}`);
          lines.push(`   💰 ${fmt(item.unitPrice * item.qty)}`);
        });
        const total = cart.reduce((s, i) => s + i.unitPrice * i.qty, 0);
        lines.push("━━━━━━━━━━━━━━━━━");
        lines.push(`💰 *TOTAL: ${fmt(total)}*`);
        lines.push("━━━━━━━━━━━━━━━━━");
        return encodeURIComponent(lines.join("\n"));
      }

      function addRipple(e) {
        const btn = e.currentTarget;
        const circle = document.createElement("span");
        const diameter = Math.max(btn.clientWidth, btn.clientHeight);
        const rect = btn.getBoundingClientRect();
        circle.style.cssText = `width:${diameter}px;height:${diameter}px;left:${e.clientX - rect.left - diameter / 2}px;top:${e.clientY - rect.top - diameter / 2}px;`;
        circle.className = "ripple-el";
        btn.querySelector(".ripple-el")?.remove();
        btn.appendChild(circle);
      }

      /* ────────────── HOOKS ────────────── */
      function useCart() {
        const [cart, setCart] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem("amars_cart") || "[]");
          } catch {
            return [];
          }
        });

        useEffect(() => {
          localStorage.setItem("amars_cart", JSON.stringify(cart));
        }, [cart]);

        const addItem = useCallback((item) => {
          setCart((prev) => {
            const key = `${item.id}-${item.size || ""}-${[...item.selected].sort().join(",")}`;
            const existing = prev.findIndex((c) => c.cartKey === key);
            if (existing >= 0) {
              const updated = [...prev];
              updated[existing] = {
                ...updated[existing],
                qty: updated[existing].qty + item.qty,
              };
              return updated;
            }
            return [...prev, { ...item, cartKey: key }];
          });
        }, []);

        const updateQty = useCallback((cartKey, delta) => {
          setCart((prev) =>
            prev
              .map((c) =>
                c.cartKey === cartKey ? { ...c, qty: c.qty + delta } : c,
              )
              .filter((c) => c.qty > 0),
          );
        }, []);

        const removeItem = useCallback((cartKey) => {
          setCart((prev) => prev.filter((c) => c.cartKey !== cartKey));
        }, []);

        const clearCart = useCallback(() => setCart([]), []);

        const totalItems = useMemo(
          () => cart.reduce((s, c) => s + c.qty, 0),
          [cart],
        );
        const totalPrice = useMemo(
          () => cart.reduce((s, c) => s + c.unitPrice * c.qty, 0),
          [cart],
        );

        return {
          cart,
          addItem,
          updateQty,
          removeItem,
          clearCart,
          totalItems,
          totalPrice,
        };
      }

                <button
                  onClick={onClose}
                  className="p-2 rounded-full hover:bg-gray-100 transition-colors"
                >
                  <svg
                    className="w-5 h-5 text-gray-500"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      strokeWidth={2.5}
                      d="M6 18L18 6M6 6l12 12"
                    />
                  </svg>
                </button>
              </div>

              <div className="overflow-y-auto flex-1 px-5 py-5 space-y-5">
                {/* Order Type */}
                <div>
                  <label className="text-sm font-bold text-gray-700 block mb-2">
                    Order Type
                  </label>
                  <div className="flex rounded-xl border-2 border-gray-200 overflow-hidden">
                    <button
                      onClick={() => setOrderType("pickup")}
                      className={`flex-1 py-3 font-bold text-sm flex items-center justify-center gap-2 transition-all ${orderType === "pickup" ? "bg-brand text-white" : "bg-white text-gray-600 hover:bg-gray-50"}`}
                    >
                      🚶 Pickup
                    </button>
                    <button
                      onClick={() => setOrderType("delivery")}
                      className={`flex-1 py-3 font-bold text-sm flex items-center justify-center gap-2 transition-all ${orderType === "delivery" ? "bg-brand text-white" : "bg-white text-gray-600 hover:bg-gray-50"}`}
                    >
                      🛵 Delivery
                    </button>
                  </div>
                </div>

                {/* Name */}
                <div>
                  <label className="text-sm font-bold text-gray-700 block mb-1.5">
                    Name{" "}
                    <span className="text-gray-400 font-normal">
                      (optional)
                    </span>
                  </label>
                  <input
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="Your name"
                    className="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand transition-colors"
                  />
                </div>

                {/* Phone */}
                <div>
                  <label className="text-sm font-bold text-gray-700 block mb-1.5">
                    Phone{" "}
                    <span className="text-gray-400 font-normal">
                      (optional)
                    </span>
                  </label>
                  <input
                    type="tel"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    placeholder="+961 XX XXX XXX"
                    className="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand transition-colors"
                  />
                </div>

                {/* Address — delivery only */}
                {orderType === "delivery" && (
                  <div className="anim-up">
                    <label className="text-sm font-bold text-gray-700 block mb-1.5">
                      Address <span className="text-red-500">*</span>
                    </label>
                    <textarea
                      rows={3}
                      value={address}
                      onChange={(e) => setAddress(e.target.value)}
                      placeholder="Street, building, floor, area..."
                      className={`w-full border-2 rounded-xl px-4 py-3 text-sm focus:outline-none transition-colors resize-none ${!address.trim() && orderType === "delivery" ? "border-red-300 focus:border-red-500" : "border-gray-200 focus:border-brand"}`}
                    />
                    {!address.trim() && (
                      <p className="text-xs text-red-500 mt-1 font-medium">
                        ⚠️ Address required for delivery
                      </p>
                    )}
                  </div>
                )}

                {/* Order summary */}
                <div className="bg-gray-50 rounded-2xl p-4 space-y-2">
                  <div className="text-sm font-bold text-gray-700 mb-3">
                    Order Summary
                  </div>
                  {cart.map((item) => {
                    const removed = item.ingredients.filter(
                      (i) => !item.selected.includes(i),
                    );
                    return (
                      <div
                        key={item.cartKey}
                        className="flex justify-between text-sm"
                      >
                        <span className="text-gray-700 flex-1 pr-2">
                          {item.name}
                          {item.size ? ` (${item.size})` : ""} ×{item.qty}
                          {removed.length > 0 && (
                            <span className="text-red-400 text-xs block">
                              No {removed.join(", No ")}
                            </span>
                          )}
                        </span>
                        <span className="text-gray-900 font-semibold whitespace-nowrap">
                          {fmt(item.unitPrice * item.qty)}
                        </span>
                      </div>
                    );
                  })}
                </div>

                {/* Total */}
                <div className="flex justify-between items-center pt-1">
                  <span className="text-xl font-black text-gray-900">
                    Total:
                  </span>
                  <span className="text-2xl font-black text-red-600">
                    {fmt(totalPrice)}
                  </span>
                </div>

                {!storeOpen && (
                  <div className="bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-600 font-medium text-center">
                    🔴 Ordering is disabled outside business hours
                  </div>
                )}
              </div>

              {/* WhatsApp button */}
              <div className="px-5 pb-6 pt-3 border-t border-gray-100">
                <button
                  onClick={handleSend}
                  disabled={!canSend}
                  className={`w-full py-4 rounded-2xl font-bold text-base flex items-center justify-center gap-3 transition-all ripple-btn ${canSend ? "bg-wa text-white hover:bg-wa-dark active:scale-[.98] shadow-lg shadow-green-200" : "bg-gray-200 text-gray-400 cursor-not-allowed"}`}
                >
                  {/* WhatsApp icon */}
                  <svg
                    className="w-6 h-6"
                    viewBox="0 0 32 32"
                    fill="currentColor"
                  >
                    <path d="M16 0C7.163 0 0 7.163 0 16c0 2.84.745 5.51 2.047 7.834L0 32l8.389-2.006A15.94 15.94 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm0 29.333a13.285 13.285 0 01-6.806-1.873l-.487-.29-5.03 1.202 1.24-4.908-.32-.504A13.252 13.252 0 012.667 16C2.667 8.636 8.636 2.667 16 2.667S29.333 8.636 29.333 16 23.364 29.333 16 29.333zm7.44-9.667c-.408-.204-2.415-1.192-2.79-1.327-.375-.136-.648-.204-.92.204-.272.408-1.055 1.327-1.294 1.6-.238.272-.476.306-.884.102-.408-.204-1.723-.635-3.28-2.024-1.212-1.082-2.03-2.418-2.268-2.826-.238-.408-.025-.629.178-.832.183-.183.408-.476.612-.714.204-.238.272-.408.408-.68.136-.272.068-.51-.034-.714-.102-.204-.92-2.215-1.26-3.033-.33-.796-.667-.686-.92-.7-.238-.01-.51-.012-.783-.012s-.714.102-1.088.51c-.374.408-1.43 1.396-1.43 3.405 0 2.01 1.464 3.95 1.668 4.223.204.272 2.88 4.4 6.977 6.169.975.42 1.737.672 2.33.86.979.312 1.87.268 2.574.163.785-.117 2.415-.988 2.757-1.942.34-.954.34-1.773.238-1.942-.102-.17-.374-.272-.783-.476z" />
                  </svg>
                  {sent ? "✓ Opening WhatsApp..." : "Send Order on WhatsApp"}
                </button>
              </div>
            </div>
          </div>
        );
      }

      /* Menu Section */
      function MenuSection({ category, items, onSelect, isOpen }) {
        return (
          <section id={category.id} className="scroll-mt-36 mb-10">
            <div className="flex items-center gap-2 mb-5 px-4">
              <span className="text-2xl">{category.emoji}</span>
              <h2 className="font-black text-2xl text-gray-900">
                {category.label}
              </h2>
              <div className="flex-1 h-px bg-gradient-to-r from-gray-200 to-transparent ml-2" />
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 px-4">
              {items.map((item) => (
                <MenuCard
                  key={item.id}
                  item={item}
                  onSelect={onSelect}
                  isOpen={isOpen}
                />
              ))}
            </div>
          </section>
        );
      }

      /* ────────────── CINEMATIC HERO ────────────── */
      const FOOD_ITEMS = [
        {
          emoji: "🥔",
          style: { top: "15%", left: "8%" },
          anim: "cascadeLeft",
          dur: "4s",
          delay: "0s",
        },
        {
          emoji: "🌭",
          style: { top: "12%", right: "8%" },
          anim: "cascadeRight",
          dur: "4.5s",
          delay: ".5s",
        },
        {
          emoji: "🍝",
          style: { bottom: "18%", left: "6%" },
          anim: "cascadeSpin",
          dur: "5s",
          delay: "1s",
        },
        {
          emoji: "🌽",
          style: { top: "45%", left: "4%" },
          anim: "cascadeLeft",
          dur: "4.2s",
          delay: "1.5s",
        },
        {
          emoji: "🥗",
          style: { top: "40%", right: "4%" },
          anim: "cascadeRight",
          dur: "4.8s",
          delay: "2s",
        },
        {
          emoji: "🧀",
          style: { bottom: "15%", right: "6%" },
          anim: "cascadeSpin",
          dur: "5.5s",
          delay: "2.5s",
        },
      ];

      function CinematicHero({ onOrderClick, totalItems, totalPrice }) {
        const particlesRef = useRef(null);
        const heroRef = useRef(null);

        useEffect(() => {
          const container = particlesRef.current;
          if (!container) return;
          for (let i = 0; i < 30; i++) {
            const p = document.createElement("div");
            const size = Math.random() * 6 + 2;
            p.className = "hero-particle";
            p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}%;bottom:0;animation-delay:${(Math.random() * 15).toFixed(1)}s;animation-duration:${(Math.random() * 10 + 15).toFixed(1)}s;`;
            container.appendChild(p);
          }
          return () => {
            if (container) container.innerHTML = "";
          };
        }, []);

        useEffect(() => {
          const hero = heroRef.current;
          if (!hero) return;
          const onScroll = () => {
            const s = window.scrollY;
            hero.style.transform = `translateY(${s * 0.4}px)`;
            hero.style.opacity = Math.max(0, 1 - s / 650);
          };
          window.addEventListener("scroll", onScroll, { passive: true });
          return () => window.removeEventListener("scroll", onScroll);
        }, []);

        const handleCTA = (e) => {
          const btn = e.currentTarget;
          const circle = document.createElement("span");
          const d = Math.max(btn.clientWidth, btn.clientHeight);
          const r = btn.getBoundingClientRect();
          circle.className = "hero-ripple";
          circle.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
          btn.appendChild(circle);
          setTimeout(() => circle.remove(), 650);
          const menu = document.getElementById("salads");
          if (menu) menu.scrollIntoView({ behavior: "smooth" });
        };

        const handleScrollArrow = () => {
          const menu = document.getElementById("salads");
          if (menu) menu.scrollIntoView({ behavior: "smooth" });
        };

        return (
          <section ref={heroRef} className="hero-section">
            {/* Rotating gradient overlay */}
            <div className="hero-bg-rotate" />
            {/* Pulsing light rays */}
            <div className="hero-light-rays" />
            {/* Particles container */}
            <div
              ref={particlesRef}
              style={{
                position: "absolute",
                inset: 0,
                pointerEvents: "none",
                overflow: "hidden",
              }}
            />
            {/* Steam */}
            <div className="hero-steam" />

            {/* Cascading food items */}
            {FOOD_ITEMS.map((f, i) => (
              <span
                key={i}
                className="hero-food-item"
                style={{
                  ...f.style,
                  animation: `${f.anim} ${f.dur} ease-in-out ${f.delay} infinite`,
                }}
              >
                {f.emoji}
              </span>
            ))}

            {/* Content */}
            <div
              style={{
                position: "relative",
                zIndex: 10,
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: "22px",
                padding: "0 16px",
                textAlign: "center",
                top: "-250px",
              }}
            >
              <img
                src="images/logo.jpg"
                alt="Amar's Street Food"
                className="hero-logo"
                style={{ borderRadius: "16px" }}
              />
              <h1 className="hero-tagline">Authentic Lebanese Street Food</h1>
              <p className="hero-subtitle">
                Experience the vibrant flavors of Lebanon &nbsp;·&nbsp; Baked
                Potatoes &nbsp;·&nbsp; Hot Dogs &nbsp;·&nbsp; Pasta &amp; More
              </p>
              <button className="hero-cta" onClick={handleCTA}>
                🛒{" "}
                {totalItems > 0
                  ? `View Cart (${totalItems}) — ${fmt(totalPrice)}`
                  : "Order Now"}
              </button>
            </div>

            {/* Scroll indicator */}
            <button
              className="hero-scroll-btn"
              onClick={handleScrollArrow}
              aria-label="Scroll to menu"
            >
              <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
                <circle
                  cx="19"
                  cy="19"
                  r="18"
                  stroke="rgba(255,255,255,.6)"
                  strokeWidth="1.5"
                />
                <path
                  d="M12 17l7 7 7-7"
                  stroke="white"
                  strokeWidth="2.5"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              </svg>
            </button>
          </section>
        );
      }

      /* ────────────── APP ────────────── */
      function App() {
        const [storeOpen, setStoreOpen] = useState(checkOpen());
        const [minsLeft, setMinsLeft] = useState(minutesUntilOpen());
        const [activeCategory, setActiveCategory] = useState(CATEGORIES[0].id);
        const [selectedItem, setSelectedItem] = useState(null);
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
        const {
          cart,
          addItem,
          updateQty,
          removeItem,
          clearCart,
          totalItems,
          totalPrice,
        } = useCart();
        const mainRef = useRef(null);

        // Poll store open status every minute
        useEffect(() => {
          const id = setInterval(() => {
            setStoreOpen(checkOpen());
            setMinsLeft(minutesUntilOpen());
          }, 60000);
          return () => clearInterval(id);
        }, []);

        // Scroll spy
        useEffect(() => {
          const handler = () => {
            const scrollY = window.scrollY + 180;
            for (const cat of CATEGORIES) {
              const el = document.getElementById(cat.id);
              if (el && el.offsetTop <= scrollY) setActiveCategory(cat.id);
            }
          };
          window.addEventListener("scroll", handler, { passive: true });
          return () => window.removeEventListener("scroll", handler);
        }, []);

        const scrollToCategory = (id) => {
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          setActiveCategory(id);
        };

        const handleAdd = (item) => {
          addItem(item);
          setSelectedItem(null);
        };

        return (
          <div className="min-h-screen bg-gray-50">
            {/* Status banner */}
            {storeOpen ? <OpenBanner /> : <ClosedBanner minsLeft={minsLeft} />}

            {/* Sticky header */}
            <Header
              activeCategory={activeCategory}
              onCategoryClick={scrollToCategory}
              totalItems={totalItems}
              onCartOpen={() => setIsCartOpen(true)}
              isOpen={storeOpen}
            />

            {/* Cinematic Hero */}
            <CinematicHero
              onOrderClick={() => setIsCartOpen(true)}
              totalItems={totalItems}
              totalPrice={totalPrice}
            />

            {/* Menu */}
            <main ref={mainRef} className="max-w-5xl mx-auto pb-24 pt-6">
              {CATEGORIES.map((cat) => {
                const items = MENU.filter((m) => m.category === cat.id);
                if (!items.length) return null;
                return (
                  <MenuSection
                    key={cat.id}
                    category={cat}
                    items={items}
                    onSelect={setSelectedItem}
                    isOpen={storeOpen}
                  />
                );
              })}
            </main>

            {/* Floating cart button (mobile) */}
            {totalItems > 0 && !isCartOpen && !isCheckoutOpen && (
              <div className="fixed bottom-5 inset-x-4 z-30 sm:hidden anim-up">
                <button
                  onClick={(e) => {
                    addRipple(e);
                    setIsCartOpen(true);
                  }}
                  className="w-full bg-brand text-white font-bold py-4 rounded-2xl shadow-xl shadow-orange-300 flex items-center justify-between px-5 ripple-btn"
                >
                  <span className="bg-white/20 rounded-lg px-2 py-0.5 text-sm">
                    {totalItems} items
                  </span>
                  <span>View Cart</span>
                  <span>{fmt(totalPrice)}</span>
                </button>
              </div>
            )}

            {/* Modals */}
            {selectedItem && (
              <CustomizeModal
                item={selectedItem}
                onClose={() => setSelectedItem(null)}
                onAdd={handleAdd}
              />
            )}

            {isCartOpen && (
              <CartSidebar
                cart={cart}
                totalPrice={totalPrice}
                onClose={() => setIsCartOpen(false)}
                onQty={updateQty}
                onRemove={removeItem}
                onCheckout={() => {
                  setIsCartOpen(false);
                  setIsCheckoutOpen(true);
                }}
              />
            )}

            {isCheckoutOpen && (
              <CheckoutPanel
                cart={cart}
                totalPrice={totalPrice}
                onClose={() => setIsCheckoutOpen(false)}
                isOpen={storeOpen}
              />
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
